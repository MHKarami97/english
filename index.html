<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%APP_NAME% - 4000 Essential English Words</title>
    <meta name="description" content="%APP_DESCRIPTION%" />
    <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%APP_NAME%" />
    <meta property="og:title" content="%APP_NAME% - 4000 Essential English Words" />
    <meta property="og:description" content="%APP_DESCRIPTION%" />
    <meta property="og:url" content="https://english.mhkarami97.ir/" />
    <meta name="twitter:card" content="summary" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('lexi-theme') || 'system';
          const dark =
            stored === 'dark' ||
            (stored === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
